function render(){
  let u=localStorage.getItem(SESSION);
  if(!u||!account()[u])return;

  loadForUser(u);

  let p=data.profile;
  let t=totals();

  let burned=data.day.exercise.reduce(
    (n,x)=>n+(Number(x.cal)||0),0
  );

  let workoutMinutes=data.day.exercise.reduce(
    (n,x)=>n+(Number(x.min)||0),0
  );

  hello.textContent='Good to see you, '+(p.name||'there')+' 👋';
  avatar.textContent=initials(p.name);
  bigAvatar.textContent=initials(p.name);
  profileName.textContent=p.name||'FitTrack user';
  profileUser.textContent=u;

  homeCal.textContent=Math.round(t.cal);
  targetCal.textContent=Math.round(p.cal);
  leftCal.textContent=Math.max(0,Math.round(p.cal-t.cal));

  calBar.style.width=pct(t.cal,p.cal)+'%';

  homeP.textContent=Math.round(t.p);
  homeC.textContent=Math.round(t.c);
  homeF.textContent=Math.round(t.f);
  homeW.textContent=data.day.water;

  tp.textContent=p.p;
  tc.textContent=p.c;
  tf.textContent=p.f;

  pBar.style.width=pct(t.p,p.p)+'%';
  cBar.style.width=pct(t.c,p.c)+'%';
  fBar.style.width=pct(t.f,p.f)+'%';

  mealSummary.textContent=data.day.foods.length
    ?data.day.foods.length+' entries logged'
    :'No food logged yet';

  streak.textContent=Math.min(99,data.history.length+1);

  let h=p.height/100;
  let bmi=h&&p.weight?p.weight/(h*h):0;

  bmiValue.textContent=bmi?bmi.toFixed(1):'—';
  bmiLabel.textContent=bmi?bmiLabelText(bmi):'Add profile';

  exerciseKcal.textContent=Math.round(burned)+' kcal';
  exerciseMinutes.textContent=Math.round(workoutMinutes)+' min';

  renderRecent();
  renderMeals();
  renderProgress();
  renderTools();
  loadSettings();
}
