name: FitTrack APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract FitTrack project
        run: |
          rm -rf fittrack_project
          unzip -o FitTrack.zip -d fittrack_project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build FitTrack APK
        run: |
          PROJECT_ROOT=$(find fittrack_project -name settings.gradle -type f -exec dirname {} \; | head -n 1)
          echo "Project: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FitTrack.apk"

      - name: Upload FitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack
          path: FitTrack.apk
